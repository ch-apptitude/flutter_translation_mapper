name: flutter_translation_mapper_example
description: Minimal app showing how to set up flutter_translation_mapper and translate strings with context.translate.
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_translation_mapper:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # The package loads its .arb files from the asset bundle, so the l10n
  # folder has to be declared here.
  assets:
    - lib/l10n/
